name: reproducible-public-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies (pinned for byte-reproducibility)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild all outputs from raw data
        run: |
          python scripts/extract_new_yearbook.py
          python scripts/build_data.py

      - name: Node DOM-stub smoke test (website)
        run: node tests/app_smoke.mjs

      - name: Ensure committed outputs are reproducible
        run: |
          git diff --exit-code -- docs/data dict data/processed || {
            echo "::error::Rebuild produced different outputs — committed files are stale or irreproducible"
            exit 1
          }

      - name: Public-data compliance scan
        run: |
          set -e
          test -f docs/index.html
          test -f dict/indicator_dictionary.csv
          grep -q '"data_mode":"real"' docs/data/city_data.js
          grep -q '"data_mode":"real"' docs/data/indicator_dictionary.js
          test -f data/raw/SOURCE.md
          test -f data/raw/china_city_statistical_yearbook_prefecture_1999_2018.dta
          test -f data/raw/who_ambient_air_quality_database_v6.1_2024.xlsx
          test -d data/raw/yearbook_vols/2025
          # 禁止个体级/受限数据入库（data/raw 的两份公开文件除外）
          if find . -type f \( -name '*.rds' -o -name '*.parquet' -o -name '*.sav' \) | grep -q .; then
            echo "::error::Restricted data files must not be committed to this public repository"
            exit 1
          fi
          if grep -R -n -E 'patient_id|id_card|身份证号' --exclude-dir=.git --exclude='*.md' . ; then
            echo "::error::Potential personal identifiers detected"
            exit 1
          fi
          echo "Public compliance scan passed"

      - name: Static site smoke check
        run: |
          grep -q 'docs/data/city_data.js' docs/index.html
          grep -q 'docs/assets/app.js' docs/index.html
          echo "Static site wiring ok"
